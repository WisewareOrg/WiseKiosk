# The one boundary schema. Owned by neither package; both sides' routes, client, server and types
# are generated from it, each inside the package that compiles them
# (ADR 0008 rev 6, ADR 0021 rev 4).
#
# Two kinds of path live here. A **module data route** carries the full component set — its success
# payload, the upstream failure and the client rejection below — and a module contributes its payload
# as a named component here rather than as a file of its own. It is marked with the `module-route`
# tag, which is the only tag this schema uses. An **infrastructure route** answers about the process
# rather than about a source, declares its own response and nothing more, and is not a module's to
# contribute. Which paths of either kind exist is what `paths` below says; no document counts them.
#
# Both sides generate their routes from this file, and from this file alone: there is no second
# document between it and either generator. Nothing is added or renamed for either side, and nothing
# is authored twice.
#
# The two error bodies below are the compact shapes ADR 0026 rev 2 decides. `cause` is an open
# string in both: which causes there are is a verification item's, not this schema's.
openapi: 3.0.3
info:
  title: WiseKiosk boundary contract
  # OpenAPI requires this field. Nothing reads it: neither generator emits it, no release is cut
  # against it, and the two sides ship in one image, so it tracks nothing and gates nothing.
  version: 0.1.0
paths:
  # An infrastructure route: it answers that the process is serving and nothing else, so it declares
  # no body at all. Every consumer reads the status code (ADR 0007 rev 2, ADR 0020 rev 5).
  /healthz:
    get:
      operationId: getHealthz
      summary: Report that the backend process is serving.
      responses:
        '200':
          description: The backend process is up.

  # A module data route: the weather module's payload is the `Weather*` components below, and the
  # route declares the full set — the payload, every rejection the framework answers before an
  # upstream call, and every failure it answers after one (ADR 0026 rev 2).
  /api/weather:
    post:
      operationId: postApiWeather
      summary: Report the weather at a point on the earth's surface.
      # Every module data route carries this tag and nothing else carries it. It is what marks the
      # kind of path this is for a reader and for anything selecting over the schema; neither
      # generator reads it (ADR 0008 rev 6).
      tags:
        - module-route
      requestBody:
        required: true
        description: The point the answer is about.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WeatherRequest'
      responses:
        '200':
          description: The weather at the point the request named.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeatherPayload'
        '400':
          description: The request named no point this route will carry upstream.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientRejection'
        '429':
          description: This source is being asked for more often than its limit allows.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientRejection'
        '502':
          description: The source could not be reached, refused the request, or answered unreadably.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpstreamFailure'
        '503':
          description: This backend stopped serving before the source could answer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpstreamFailure'
        '504':
          description: The source did not answer in time.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpstreamFailure'
  # A module data route: the park-wait-times module's payload is the `ParkWaitTimes*` components
  # below, and the route declares the full set — the payload, every rejection the framework answers
  # before an upstream call, and every failure it answers after one (ADR 0026 rev 2).
  /api/park-wait-times:
    post:
      operationId: postApiParkWaitTimes
      summary: Report the current wait times for the parks a request names.
      tags:
        - module-route
      requestBody:
        required: true
        description: The parks the answer is about.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParkWaitTimesRequest'
      responses:
        '200':
          description: The wait times for the parks the request named.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParkWaitTimesPayload'
        '400':
          description: The request named no park this route will carry upstream.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientRejection'
        '429':
          description: This source is being asked for more often than its limit allows.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientRejection'
        '502':
          description: The source could not be reached, refused the request, or answered unreadably.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpstreamFailure'
        '503':
          description: This backend stopped serving before the source could answer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpstreamFailure'
        '504':
          description: The source did not answer in time.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpstreamFailure'
components:
  schemas:
    UpstreamFailure:
      type: object
      description: >-
        The body a module's failed data request carries back, distinct to its cause so an operator
        can tell a source being down from a key being wrong.
      required:
        - module
        - cause
        - message
      properties:
        module:
          type: string
          description: The module whose request failed, so the failure is contained to its own place.
        cause:
          type: string
          description: What kind of failure this was. An open string; the cause set is not fixed here.
        message:
          type: string
          description: Plain-language text the module renders as its error state.
    ClientRejection:
      type: object
      description: >-
        The body a request rejected before any upstream call carries back, distinct to its cause and
        renderable by the frontend.
      required:
        - cause
        - message
      properties:
        cause:
          type: string
          description: Why the request was rejected. An open string; the cause set is not fixed here.
        message:
          type: string
          description: Plain-language text the frontend renders.
    WeatherRequest:
      type: object
      description: >-
        The point a request names. It is the whole of what this route reads of a request.
      required:
        - lat
        - lon
      properties:
        lat:
          type: number
          format: double
          description: Latitude of the point, in decimal degrees north of the equator.
        lon:
          type: number
          format: double
          description: Longitude of the point, in decimal degrees east of the prime meridian.
    WeatherPayload:
      type: object
      description: >-
        The weather module's payload: what the weather is doing at one location now, and what it is
        expected to do over the hours and the days next to come. Every temperature here is in
        degrees Fahrenheit and every wind speed in miles per hour.
      required:
        - current
        - hourly
        - daily
      properties:
        current:
          $ref: '#/components/schemas/WeatherCurrent'
        hourly:
          type: array
          description: The hours next to come, nearest first. How many is the shaping library's.
          items:
            $ref: '#/components/schemas/WeatherHour'
        daily:
          type: array
          description: The days next to come, nearest first. How many is the shaping library's.
          items:
            $ref: '#/components/schemas/WeatherDay'
    WeatherCurrent:
      type: object
      description: The weather at the location at present.
      required:
        - temp
        - apparentTemp
        - humidity
        - windSpeed
        - weatherCode
        - isDay
      properties:
        temp:
          type: number
          format: double
          description: Air temperature, in degrees Fahrenheit.
        apparentTemp:
          type: number
          format: double
          description: How warm it feels, in degrees Fahrenheit.
        humidity:
          type: number
          format: double
          description: Relative humidity, as a percentage.
        windSpeed:
          type: number
          format: double
          description: Wind speed, in miles per hour.
        weatherCode:
          type: integer
          description: What the sky is doing, as a WMO 4677 present-weather code.
        isDay:
          type: boolean
          description: Whether it is daylight at the location.
    WeatherHour:
      type: object
      description: The weather expected at the location for one hour to come.
      required:
        - time
        - temp
        - weatherCode
        - precipProbability
        - isDay
      properties:
        time:
          type: string
          description: >-
            The hour this entry is for, as an ISO 8601 timestamp carrying the location's own UTC
            offset — `2026-08-31T14:00:00-04:00` — so the hour is unambiguous wherever it is read.
        temp:
          type: number
          format: double
          description: Air temperature expected, in degrees Fahrenheit.
        weatherCode:
          type: integer
          description: What the sky is expected to be doing, as a WMO 4677 present-weather code.
        precipProbability:
          type: number
          format: double
          description: The chance of precipitation, as a percentage.
        isDay:
          type: boolean
          description: Whether it is daylight at the location for this hour.
    WeatherDay:
      type: object
      description: The weather expected at the location for one day to come.
      required:
        - time
        - weatherCode
        - max
        - min
        - precipProbability
      properties:
        time:
          type: string
          description: >-
            The day this entry is for, as an ISO 8601 timestamp at that day's start carrying the
            location's own UTC offset — `2026-08-31T00:00:00-04:00`.
        weatherCode:
          type: integer
          description: What the sky is expected to be doing, as a WMO 4677 present-weather code.
        max:
          type: number
          format: double
          description: The warmest the day is expected to get, in degrees Fahrenheit.
        min:
          type: number
          format: double
          description: The coldest the day is expected to get, in degrees Fahrenheit.
        precipProbability:
          type: number
          format: double
          description: The chance of precipitation, as a percentage.
    ParkWaitTimesRequest:
      type: object
      description: >-
        The parks a request names. It is the whole of what this route reads of a request.
      required:
        - parks
      properties:
        parks:
          type: array
          description: >-
            The parks the answer is about, each resolved by this module against a set of names it
            knows or passed to the source exactly as given
            (SRS068<!-- The park-wait-times module resolves a park it recognizes and passes through
            one it does not -->).
          items:
            type: string
        useDefaultBlacklist:
          type: boolean
          description: >-
            Whether the module's own prebuilt list of non-ride entities (matched by entity id) is
            applied besides the request's own blacklist. Omitted, this defaults to true; the two
            lists are additive, the one never replacing the other.
        blacklist:
          type: array
          description: >-
            Ride names this request excludes besides the prebuilt list, each matched against a
            ride's name trimmed, case-folded and folded for the curly quotes and apostrophes a
            plainly-typed name would otherwise miss, then compared whole rather than as a
            substring. Omitted, this defaults to an empty list.
          items:
            type: string
    ParkWaitTimesPayload:
      type: object
      description: >-
        The park-wait-times module's payload: one entry per park the request named, in the order
        named (SRS054<!-- The park-wait-times module reports on the parks its configuration
        names -->).
      required:
        - parks
      properties:
        parks:
          type: array
          items:
            $ref: '#/components/schemas/ParkWaitTimesPark'
    ParkWaitTimesPark:
      type: object
      description: One park's reading, or why it has none.
      required:
        - name
        - available
      properties:
        name:
          type: string
          description: >-
            What the park's card reads. For a park the module recognizes — by its pretty name or its
            upstream entity id — this is the module's own pretty name for it, never the fuller name the
            source carries; for a park passed through unrecognized, it is the source's own name, or the
            configured string until the source supplies one.
        available:
          type: boolean
          description: Whether this park's own reading could be produced.
        message:
          type: string
          description: >-
            Plain-language text the module renders in this park's place. Present only where
            `available` is false.
        hours:
          $ref: '#/components/schemas/ParkWaitTimesHours'
        rides:
          type: array
          description: >-
            Every one of the park's rides, each with its name and current wait
            (SRS056<!-- The park-wait-times module puts each park's identity, hours, and ride
            waits across the boundary -->). Present only where `available` is true.
          items:
            $ref: '#/components/schemas/ParkWaitTimesRide'
    ParkWaitTimesHours:
      type: object
      description: The park's operating hours for the day. Absent where the source reports none.
      required:
        - open
        - close
      properties:
        open:
          type: string
          description: >-
            When the park opens today, as an ISO 8601 timestamp carrying the park's own UTC offset.
        close:
          type: string
          description: >-
            When the park closes today, as an ISO 8601 timestamp carrying the park's own UTC offset.
    ParkWaitTimesRide:
      type: object
      description: One ride's name, its operating state, and its posted wait when it has one.
      required:
        - name
        - state
        - waitMinutes
      properties:
        name:
          type: string
        state:
          $ref: '#/components/schemas/ParkWaitTimesState'
        waitMinutes:
          type: integer
          nullable: true
          description: >-
            The standby wait in minutes when `state` is `Operating`; null in every other state
            (SRS061<!-- The park-wait-times module draws a wait as the time or the not-operating
            state it is handed -->).
    # A $reffed bare-string enum rather than a oneOf: generates a plain string type and constants,
    # pulling none of the runtime dependency a union would (ADR 0008 rev 6).
    ParkWaitTimesState:
      type: string
      enum:
        - Operating
        - Down
        - Closed
        - Refurb
      description: >-
        A ride's operating state — `Operating`, or the not-operating state it is in
        (SRS061<!-- The park-wait-times module draws a wait as the time or the not-operating state
        it is handed -->), the single generated set both sides read.
