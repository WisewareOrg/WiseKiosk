# oapi-codegen's own configuration. The whole wire contract — types, the route table, and the client
# the backend probes itself with — so no route is hand-authored on this side and generation reaches
# routes rather than types alone (ADR 0008 rev 6). `std-http-server` binds against the standard
# library's own ServeMux and pulls no router (ADR 0001 rev 1), and no route binds a parameter, so the
# emitted Go imports nothing outside the standard library at all.
# Paths are resolved against the working directory, which is `backend/internal/boundary/` (the
# `go:generate` directive in its `doc.go`).
package: boundary
output: boundary.gen.go
generate:
  models: true
  std-http-server: true
  client: true
output-options:
  # A component no path references is pruned by default, and the error bodies are contributed by
  # the schema ahead of the module routes that carry them.
  skip-prune: true
