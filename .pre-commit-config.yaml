# The local hook layer (ADR 0016 rev 12). `pre-commit install` wires the stages listed in
# default_install_hook_types; CI runs the pre-commit stage over every tracked file via
# `just check-hooks`. pre-commit skips a hook whose file set is empty and reports success; the
# `local` hooks below carry `always_run`, and none reads the staged-file set — the commitlint
# hook reads the commit-message file, at its own stage rather than check-hooks' run.
default_install_hook_types: [pre-commit, commit-msg, pre-push]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      - id: detect-private-key
      - id: check-added-large-files
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: [--fix=no]
  - repo: local
    hooks:
      - id: rev-reach
        name: ADR citations re-pinned with the sentence untouched (reports)
        entry: python3 scripts/adr-rev-reach.py
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-push]
        verbose: true
      # The Conventional-Commit gate at its one stage (ADR 0016 rev 12): .commitlintrc.json,
      # whose `defaultIgnores` pass fixup!/squash!/merge subjects, discarded by the squash anyway.
      # The npm pin is written once in additional_dependencies; neither Dependabot nor
      # `pre-commit autoupdate` reaches it, so the version is updated by hand.
      - id: commitlint
        name: commit message is a Conventional Commit (.commitlintrc.json)
        entry: commitlint --edit
        language: node
        additional_dependencies:
          - "@commitlint/cli@21.2.2"
          - "@commitlint/config-conventional@21.2.2"
        always_run: true
        stages: [commit-msg]
