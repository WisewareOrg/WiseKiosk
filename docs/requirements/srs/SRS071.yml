reviewed: w0Rfntd2WHYyaaQEZVtGcB7VdYvF7r4iy6orKswy6cM=
status: accepted
text: |
  The park-wait-times module shall bring into view the part of a ride's name that the name's own column
  cannot hold at once, by moving the name through that column; a name the column already holds shall
  not move.
verification-justification: |
  Read from a rendered page under a driven clock, over a fixture whose name genuinely overflows its own
  column - checked as part of the reading, so a column that never moves is a failure to reveal rather
  than a column with nothing to reveal. Two readings: the overflowing name leaves its
  start, reaches the end of what the column does not show, and returns; and a name that fits, on a card
  beside it, never moves.
  What it does not settle. That a viewer reads the whole of a long name: the reveal is bounded by how
  long one pass runs, and a name longer than that pass covers is read in part, which is intended and is
  asserted nowhere. How fast the name moves and how long it waits at either end, which this item does
  not oblige and no check reads against any figure stated here. And it is bounded by the names the
  suite supplies and the viewports it renders at, so a name that first fails to be revealed at a
  viewport nothing samples passes.
verification-method: test
