reviewed: 1wxv6oNvlEEnjmtG3zNI0rh3qyUu1cMb-Jf5S9RdVyU=
status: accepted
text: |
  When a module's own rendering fails, the display shall say in that module's place that the module
  has stopped drawing, and no other module shall be affected, including one sharing its region.
verification-justification: |
  Read from a rendered page carrying a module that fails while rendering, a module sharing its region,
  and a module elsewhere whose reading moves on its own: the page carries one report, in the faulting
  module's place and nowhere else; the faulting module is no longer drawing; the neighbours are still
  drawing, and the one that moves is still moving.
  Movement rather than presence is what the third of those rests on, because a page whose rendering has
  stopped holds every element it last drew and so passes any count or visibility read over it.
  Three things it does not settle. The report's wording is asserted to be non-empty and not judged -
  whether it reads usefully to somebody who did not write it is what
  SYS001<!-- Failure is legible and proportionate --> routes to review. One manner of failing is staged,
  raised at one point in a module's life, so this is evidence that a module's failure is caught where
  the module is mounted rather than proof that no way of failing escapes. And the obligation quantifies
  over every module while the evidence is read against a module the suite supplies for the purpose: a
  module that no check drives is unasserted here rather than covered by the stub's reading.
verification-method: test
