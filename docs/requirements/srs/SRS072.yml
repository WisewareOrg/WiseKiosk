text: |
  The park-wait-times module shall advance its cards' tours together, a card with more than one page of
  rides to show taking its next page at the same moment as every other such card it is drawn beside.
verification-justification: |
  Read from a rendered page under a driven clock, over a configuration placing more than one park and a
  payload giving those parks different numbers of pages to tour, so that agreement is read where the
  cards show different positions rather than only where they would coincide anyway. Each card's marked
  position is read a step short of the interval as well as across it, which bounds both advances into
  the one window rather than finding only that both had moved by the time the interval had passed; and
  read again across the tick on which the shorter tour returns to its first page while the longer takes
  its last, which is where a position derived from the shared count modulo each card's own page total
  parts company with one that holds at its last page.
  What it does not settle, and this is the part that is not obvious. Whether the module keeps one
  interval for the placement or one per card: driven time advances every pending timer at once, so
  per-card timers created in the same flush reproduce these readings exactly, and that was staged
  rather than assumed. Timer identity is not observable under a driven clock; phase is. What separates
  the two is drift accumulated against real time, which no check in a render tier models - so a
  deployment whose cards crept apart over the hours a wall display stays up would breach this item with
  every check still green. That is a gap in the evidence rather than in the obligation: what is
  obliged is that the cards agree, not that one timer produces the agreement.
  Whether the cards agree any more closely than that window, this item obliging no margin. And it is
  bounded by the rosters and page counts the suite supplies and the intervals it drives, so a drift
  appearing only after more turns than a check runs, or at a card count nothing samples, passes.
verification-method: test
