reviewed: B27l6QUiGfzFgkSrpwt9PTQ07s202uycvm-LugOXniU=
status: accepted
text: |
  Once the backend is reachable again, the display shall stop reporting the outage and shall draw again
  a module it is holding behind a failure state, with nobody attending the display.
verification-justification: |
  Both halves are read on the page the failure was raised on, never on a fresh one, since what is in
  question is whether that page can still change what it says: the outage report is gone once the
  backend answers, and a module held behind a report of its having stopped is drawing again with the
  report gone with it. Nothing reloads the page and nothing asks it to retry, which is what makes the
  readings evidence of the unattended clause. That the page is still rendering while it does this is
  read off a module whose content moves on its own, presence being worth nothing on a page whose
  rendering has stopped.
  What it does not settle. A fault whose cause is not a reachability change is not obliged to clear and
  does not: what is proven is recovery across that one transition, staged once, in one manner. Nothing
  bounds how long recovery takes, this item obliging none. And the modules an outage stood down are
  read as drawing again for the ones a suite drives, the obligation quantifying over every module the
  display is holding.
verification-method: test
