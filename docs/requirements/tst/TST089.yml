header: |
  The display recovers when the backend answers again
level: 111
links:
- SRS070: 3sth-H1jcQn8KXFLG6py87HV0FW17RvM13cX5L69W9s=
normative: true
rationale: |
  Three readings rather than one, because the parent names two things the display takes down and one it
  puts back: the outage report, the report standing where a module stopped drawing, and the module
  itself. A display that withdrew the outage report and left a module dark would pass a check reading
  only the first.
  Every reading is taken on the page the failure was raised on. Nothing reloads and nothing asks the
  page to retry, which is the whole of the unattended clause - a fresh load recovers trivially and
  settles nothing, and a display on a wall has nobody to give it one.
  The faulting case is staged over a page that was live rather than one loaded already in the failure,
  because the failure this parent was written against is raised by the teardown the transition does,
  and a page that never drew the element never tears one down. That gap is what let a display hold an
  outage report for fifty-two minutes with the backend answering behind it while the tier's own
  recovery case stayed green.
  That the page is still rendering while it recovers is read off a module whose content advances on its
  own, presence being worth nothing on a page whose rendering has stopped.
