status: accepted
text: |
  Render tests driving a display through an outage and out of it again on one loaded page - one with a
  module standing down behind the page's outage report, one with a module that failed while rendering -
  asserting that once the backend answers the outage report is gone, the report standing where the
  failed module was is gone, and each module is drawn again with its own content, with nothing
  reloading the page and nothing asking it to retry.
verification-justification: |
  Settles that the outage report is withdrawn, that a module stood down by the outage is drawn again,
  and that a module held behind a report of its having stopped is drawn again with that report taken
  away - each on the page the failure was raised on, with nothing reloading it and nothing asking it to
  retry.
  Leaves unproven any recovery not driven by the backend answering again: a failure whose cause is not
  a reachability change is not obliged to clear here and does not. Leaves unproven how long recovery
  takes, the parent obliging no bound. One manner of outage is staged, so this is evidence that the
  display can change what it says on the far side of one rather than proof that no manner of outage
  strands it. And every module but the ones these cases drive is unasserted.
verification-method: test
