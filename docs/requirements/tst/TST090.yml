text: |
  Render tests over a fixture carrying a ride name that overflows the column it is drawn in, asserting
  under a driven clock that the name leaves its start, reaches the end of what the column does not show
  and returns there; and that a name the column already holds, drawn on the same card as an
  overflowing one, never leaves its start.
verification-justification: |
  Settles that an overflowing ride name is brought into view by moving through its column and that a
  name needing no reveal is left alone - each read off the column's own offset rather than off a marker
  the module sets, so a module that records the decision and then does the opposite is caught.
  Leaves unproven that a viewer reads the whole of a long name: the reveal is bounded by one pass, and
  a name longer than a pass covers is read in part, which is intended and asserted nowhere. Leaves
  unproven anything about pace or the waits at either end, which the parent does not oblige. And it is
  bounded by the names the fixtures carry and the viewports the tier renders at - a name that first
  fails to be revealed at a viewport nothing samples passes.
verification-method: test
