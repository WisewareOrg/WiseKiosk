normative: true
rationale: |
  Two cases because the parent has two clauses and each is passed by a module that fails the other.
  A module that moves every name alike passes the reveal and fails the name that already fits; a module
  that moves nothing passes the name that already fits and fails the reveal.
  Each case checks its own fixture first - that the name really does overflow the column it is in -
  because a column with nothing to reveal does not move either, and the two are the same reading. The
  fitting case goes further and puts an overflowing name on the same card, so a card where nothing at
  all is moving cannot be read as a name correctly left alone.
  The clock is driven rather than waited on, so what the cases read is where the name is at an instant
  they choose; none of them asserts how long the module takes to get there, which the parent does not
  oblige.
