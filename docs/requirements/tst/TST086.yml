text: |
  Unit tests exercising the module's own HTTP handler, without a network: a configured park whose
  name matches one in the module's offline set is fetched from the upstream at the identity recorded
  for it there, matching regardless of case or surrounding space; a configured park matching none of
  that set is fetched from the upstream exactly as it was named, treated as the identifier itself -
  neither outcome refuses the request.
verification-justification: |
  Settles that a recognized name resolves to its own known identity and an unrecognized one passes
  through unexamined, both admitted rather than refused.
  What it cannot settle is whether a resolved or passed-through identifier is one the source answers
  for at the time of the request, which is the source's own failure, surfaced by the failure path this
  item does not cover.
verification-method: test
