header: |
  A module's failure is contained to that module
level: 110
links:
- SRS069: 2uue1XX1wNcv1k0etxyA81-GRuFlvkqneSenDgG2eUE=
normative: true
rationale: |
  Read against a stub written to fail rather than against a module, because what the framework owes is
  owed whichever module failed: a check staged on the module that last carried the defect would be
  discharged by that module's own fix rather than by containment existing at all.
  Two neighbours are on the display and not one, because the parent's containment clause names two
  different ones - a module elsewhere on the display, and a module sharing the faulting module's own
  region. A boundary drawn around the region rather than around the placement passes the first and
  fails the second.
  The surviving neighbour that carries the evidence is one whose reading moves on its own, and the
  reading is taken across a change it cannot fake. A page whose rendering has stopped holds every
  element it last drew, so presence, counts and visibility are all satisfied by the exact failure this
  item exists to catch; only something that has to be drawn again to change tells the two apart.
  The absence of an escaped error is read after the report rather than before it: an absence is also
  what a stub that never failed would show, and the report is what says one did.
