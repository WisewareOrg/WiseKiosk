text: |
  Render test staging a module that fails while rendering on a display that was whole, with a module
  sharing its region and a module elsewhere whose reading advances on its own, asserting that the page
  carries one report of the failure, in the faulting module's place and nowhere else; that the report
  carries text; that the faulting module is no longer drawn; that both neighbours are still drawn and
  the advancing one is still advancing across a change it cannot hold; and that no error escaped to the
  page.
verification-justification: |
  Settles that a module failing mid-render is caught where the module is mounted rather than at the
  page, that the display says so in that module's place alone, and that every other module - including
  one sharing the faulting module's region - goes on rendering.
  Leaves unproven the wording of the report, which is asserted non-empty and not judged; every manner
  of failing but the one staged, and every point in a module's life but the one it is raised at; and
  every module but the stub the tier supplies, the obligation quantifying over all of them while this
  reads one written for the purpose.
verification-method: test
