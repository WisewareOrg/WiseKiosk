status: proposed
text: |
  Integration test driving the module's route under a driven clock and a slow staged source that
  answers, asserting the requests that leave stay within the hourly bound the requirement states for
  one location while that source is answering, and that a second is never outstanding while a first
  has not answered.
verification-justification: |
  Settles what this system emits while its source is answering, under a clock the harness drives.
  Leaves unproven what the source will tolerate: another party's rate policy is published or not at its
  own discretion, changed without notice, and not decidable here. It is asserted over the window the
  suite runs rather than over a deployment left running for years, so a drift that only appears over
  that span is outside it.
verification-method: test
