status: proposed
text: |
  Integration test asserting the frontend-serving response carries a Permissions-Policy, and that the
  set of features the served policy grants equals a committed granted-feature allowlist - empty until
  a module declares it needs one - with every other feature the policy names denied; and that the
  page still renders under the served policy. Fails if the header is absent, if a granted feature is
  not on the allowlist, or if an allowlist entry does not name the module that needs it.
verification-justification: |
  Settles that the page grants no capability outside the committed allowlist and still renders. Leaves
  unproven whether an allowlist entry is justified - no artifact lets a module declare the capabilities
  it needs, so the entry names its module by hand and that naming rests on review.
verification-method: test
