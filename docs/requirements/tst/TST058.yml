header: |
  The weather module's location constraint admits and rejects
level: 80
links:
- SRS043: rFg2Wzv4P8LHpir69U-rSIpHFSkzgA2K72zWWFD8s5E=
normative: true
rationale: |
  The rejecting half is where a check is fooled. A module admitting everything passes a test fed only
  good input, so the non-conforming cases carry the assertion and the admitting ones only establish that
  the constraint is not refusing its own subject.
  The non-conforming cases are values rather than spellings. A body that is not a number at all never
  reaches the constraint, being refused by the decoding, so what this exercises is the half the module
  owns - a well-formed number outside the earth's surface.
  The no-request clause is read with them rather than separately: a rejection that still went upstream
  is exactly the failure the item forbids, and it is invisible in the status a caller gets back.
