text: |
  Unit test exercising the constraint the module declares over conforming and non-conforming
  locations, asserting that a point on the earth's surface is admitted, that every other value is
  rejected, and that no upstream request is issued for a rejected one.
verification-justification: |
  Settles which values the module admits, and that a rejected request costs no upstream call.
  Leaves unproven that an admitted location is one the source can answer for - a well-formed point the
  source has nothing for is an upstream failure rather than a rejection - and bounds the rejecting half
  by the non-conforming cases the suite enumerates, a malformation nobody thought of being unasserted.
verification-method: test
