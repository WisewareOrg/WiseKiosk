status: proposed
text: |
  Render test loading the page once and advancing the held host clock twice, each time by more than
  the smallest unit the clock displays, asserting after each advance that the displayed time has moved
  to match - so that a clock frozen at first render and a clock that updates once and stops each fail.
verification-justification: |
  Settles that the displayed time follows the host clock across successive advances on one loaded page,
  which fails a clock frozen at first render and a clock that updates once.
  Leaves unproven the behaviour of a page left running for days: tracking is asserted over the span the
  harness holds the page open, so a drift or a stall appearing only over a long run is outside it.
verification-method: test
