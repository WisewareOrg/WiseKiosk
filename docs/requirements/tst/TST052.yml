header: |
  The displayed time moves as the host clock moves
level: 74
links:
- SRS037: hTyiAGqlWlrBOwNWIR6jau_BeL-gwNorP7QdPmuft_M=
normative: true
rationale: |
  The failure this catches is a module that renders once. It is invisible at a single reading and
  invisible to the source check, which a clock frozen at mount passes completely, so the assertion has
  to be made across more than one reading of the same loaded page.
  Advancing the host clock rather than waiting is what keeps this in a tier that runs on every commit:
  the item obliges tracking, not a re-render every so many seconds, and a check that waited for real
  seconds would smuggle an interval into the requirement by choosing how long to wait.
