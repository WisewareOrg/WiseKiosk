header: |
  The clock survives an unreachable backend
level: 77
links:
- SRS040: FztMJgU2LktJuauxJaOpF5Enp8VObHIco6OvPbHPtbM=
normative: true
rationale: |
  The render tier already stands a supplied upstream-backed module down against an unreachable backend;
  what it does not read is the other side of that distinction, a module that must not stand down. So
  this is asserted in the same staged outage.
  Its parent obliges every module that fetches nothing, and this item reads the clock. That is the
  ordinary shape of a verification item rather than a shortfall in it: a general obligation is
  discharged by items that each read one instance, and this one's scope is the clock alone.
  Advancing is asserted rather than presence alone, because a clock frozen at the moment the backend
  went away is the failure that would otherwise read as survival.

  Three things about how the outage is staged, each of which the item was blind to before and each of
  which is a way the clock stops without this reading it.
  The outage is driven onto a page that was live rather than served to a page already in one, because
  what the transition does is tear the upstream-backed modules down, and a page that never drew them
  never tears one down. A sibling that fails while rendering is on the display for the same reason:
  what the clock owes an outage is nothing, and what it owes a neighbour that broke in one is also
  nothing, and a display carrying only the clock has nothing on it that could take the clock with it.
  Between them those two gaps let a shipped display hold a frozen clock for fifty-two minutes while
  this item stayed green.
  And the clock is advanced past a whole minute rather than by seconds alone. The seconds are written
  straight to their own node, off the reactive graph, so they go on moving on a page whose rendering has
  stopped and cannot tell a live display from a dead one; the minute is the reading that can.
