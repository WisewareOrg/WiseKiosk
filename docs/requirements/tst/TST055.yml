text: |
  Render test driving one loaded page from a serving backend into an outage, with a module that fails
  while rendering placed beside the clock, asserting that the clock's region still carries a time, that
  it is the held host clock's, and that it goes on moving as that clock is advanced past a whole minute
  - with the clock's own content in place and no state of its own where the time was.
verification-justification: |
  Settles that neither an outage arriving under a live page nor a neighbour failing in it takes the
  clock's content or its advancing away, and that the clock puts no state of its own where the time was.
  Advancing past a whole minute is what makes that evidence: the reading that changes is one a page
  whose rendering has stopped cannot produce.
  Leaves unproven the other ways a backend can be gone: one manner of failure is staged, so this is
  evidence that the clock does not depend on the backend rather than proof no manner of outage can
  disturb it. It also leaves unproven every module its parent obliges that is not the clock - the
  obligation quantifies over all of them and this reads one, so the parent's coverage is the union of
  such items rather than this one alone. It asserts nothing about what the page says about the outage,
  nor about what becomes of the neighbour that failed.
verification-method: test
