text: |
  Render test that, handed one park whose own hours say it is open at the clock's held moment, a ride
  the payload gives a numeric wait draws that figure and a ride the payload gives a not-operating state
  draws that state — as two different kinds of mark, a class distinction rather than only different
  text — neither following the park's hours nor the page's clock where they disagree with the payload.
verification-justification: |
  Settles that the drawing follows the handed state rather than a derived one, and tells a time from a
  state. Leaves unproven whether a viewer reads the two as distinct across the room.
