text: |
  Two checks. A unit test over the module's registered policy, asserting the interval a served answer
  is held for is no longer than the five-minute bound. And a render test holding the page open against
  a source staged to change its answer and a driven clock, asserting the region carries the changed
  wait once the module's own read interval elapses, without the page being reloaded.
verification-justification: |
  Settles both halves: that an answer is held no longer than the figure the requirement states, and that
  what is drawn follows a change at the source on a page nobody reloaded. Leaves unproven how far behind
  the queue the source itself runs, which is another party's and outside this system. The render half is
  asserted against a clock the harness drives, so a page left running far longer than the suite runs is
  outside it.
verification-method: test
