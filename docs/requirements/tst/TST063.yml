status: proposed
text: |
  Render test loading the page under each of the two seconds selections against a held host clock,
  asserting that the selection asking for seconds yields the host's current seconds beside the rest of
  the time, and that the selection not asking for them leaves a time with no seconds in it.
verification-justification: |
  Settles that the seconds' presence follows the selection in both directions, and that what is shown
  when they are present is the host's seconds rather than a fixed string.
  Leaves unproven that the host's seconds are the true ones, the host being outside this system, and
  says nothing about how they are written - the separator before them and whether they are zero-padded
  are outside what the item obliges.
verification-method: test
