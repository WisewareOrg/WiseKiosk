header: |
  Seconds appear and disappear with their selection
level: 85
links:
- SRS048: vkb1gUt4IS82KQqBI4A0QyMrW5UmeFFOduUh3QKELS4=
normative: true
rationale: |
  Omission is the half a check is fooled on. A module that always draws seconds passes any assertion
  reading only the selection that asks for them, so both selections are driven and the absent case is
  asserted as an absence in the clock's own region rather than anywhere on the page.
  The seconds read are checked against the host's rather than merely being present, because a
  placeholder or a frozen zero is present too. That the field keeps moving is not read here: advancing
  is the tracking item's, already driven against the controlled host clock, and asserting it in two
  places would put one obligation under two parents.
