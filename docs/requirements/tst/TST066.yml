text: |
  Integration test driving a route under a driven clock against a source staged to fail, calling it
  far oftener than the interval it holds a failure for and asserting that no more than one request
  leaves for one location in that interval; and a unit test over the policy this module registers,
  asserting the interval it sets is no shorter than the one the requirement states.
verification-justification: |
  Settles what leaves this system while its source is failing, under a clock the harness drives, and
  that the interval this module registers is no shorter than the one the requirement states.
  Leaves unproven what the source makes of being retried while it is down, its tolerance being its
  own, and is asserted over the window the suite runs, so a failure lasting longer than the suite
  stages is outside it.
verification-method: test
