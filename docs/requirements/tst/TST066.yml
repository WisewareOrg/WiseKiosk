header: |
  The weather module's failing-source retry bound holds
level: 88
links:
- SRS049: t6P22YZO2Sylohh4_mDhP2dOXzclWojxXJZfndhXLpw=
normative: true
rationale: |
  The route is called far oftener than the bound permits, because a module passing every incoming
  request upstream and one holding the failure are indistinguishable under a caller that asks once.
  The source is staged to fail rather than to be slow: what holds the rate down on this path is the
  interval a failure is held for, and a slow source that eventually answers exercises the other bound
  instead.
  The clock is driven for the reason every bound in this module's decomposition drives it - an
  interval cannot be read from a suite that runs for seconds.
  The mechanism and the figure are read apart. The framework case drives a fixture interval, so what
  it settles is that a failure held for an interval costs one upstream call per interval however often
  the route is called; that this module registers an interval as long as the requirement states is the
  module's own package to assert, against what obliged the figure rather than against itself.
