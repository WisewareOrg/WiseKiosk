text: |
  A render test over a configuration placing two parks whose payloads give them different numbers of
  pages to tour, asserting under a driven clock that neither card's marked position has moved a step
  short of the interval and that both have moved across it, so each advance is pinned to the tick
  rather than to some moment inside the interval; and reading the pair the same way across the later
  tick on which the shorter tour returns to its first page while the longer takes its last.
verification-justification: |
  Settles that the cards agree on the moment they turn, read off each card's own marked position rather
  than off a count the module exposes, and bounds both advances into the window between the reading a
  step short of the interval and the reading across it - so a card out of phase by an appreciable
  fraction of an interval is caught, which was staged rather than assumed. Settles too that each card's
  position is derived from the shared count modulo its own page total, the wrapping tick distinguishing
  that from a position held at its last page, also staged.
  Leaves unproven that the module keeps one interval rather than one per card. Driven time advances
  every pending timer at once, so per-card timers created in the same flush produce these same
  readings, and staged that way the case passes. What separates them is drift accumulated against real
  time, which this tier does not model - so the parent's obligation could be breached slowly, over the
  hours a display stays up, with this check still green. The parent obliges agreement rather than a
  single timer, so this is a limit of the evidence rather than a clause going unread.
  Leaves unproven any agreement closer than that window, the parent obliging no margin. And it is
  bounded by the two-park roster, the page counts the fixture carries and the number of turns it
  drives, so a drift appearing only after more turns, or at a card count nothing samples, passes.
verification-method: test
