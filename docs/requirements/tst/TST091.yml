header: |
  Cards of unequal page counts turn their pages on the one tick
level: 113
links:
- SRS072: NaW5tl0FB7Ctx0d7J5fBT-x8TFpVVNIt1STESFdvvFQ=
normative: true
rationale: |
  Two properties are read, and the fixture's unequal page counts serve both.
  Each card's marked position is read a step short of its tick as well as across it. That pairing is
  what bounds the two advances into the one window, rather than establishing only that both had moved
  by the time an interval had passed: a card running a fraction of an interval out of phase has already
  advanced at the earlier reading and fails there. Staged at a three-second offset against a six-second
  interval, it does.
  The second reading is taken across the tick on which the shorter tour wraps home while the longer
  takes its last page. That is where the two cards must show different positions while still changing
  at the one moment, which separates a position derived from the shared count modulo each card's own
  page total from one that saturates at its last page. Staged as that saturating derivation, it fails.
  The unequal counts are also the fixture's own self-check: the segment counts are asserted before
  anything is driven, so a pair agreeing below is not one tour drawn twice.
  What the shape cannot reach is recorded here because it is not visible from the assertions. Under a
  driven clock this case cannot tell one interval shared across the cards from an interval per card
  created in the same flush - driven time advances every pending timer at once, so identically
  configured per-card timers reproduce these readings exactly, and staged that way the case passes.
  Timer identity is not observable here; phase is. What a per-card implementation costs is drift
  accumulated against real time, which this tier does not model.
