name: pages

# Separate from checks.yml so the read-only verification pipeline never needs
# elevated permissions: only this workflow holds `pages: write` +
# `id-token: write`, scoped to OIDC deployment, no stored credential.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Every job's `name:` equals its id: required status checks key on the displayed name.
  build:
    name: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15"

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.58.0"

      - name: Install LikeC4 into the silo (docs/architecture/), locked
        run: npm --prefix docs/architecture ci

      - name: Validate the architecture model and build its browser-free artifacts and interactive webcomponent bundle
        run: just arch-export

      - name: Install the docs-site toolchain into a local venv (siloed under docs/site/)
        run: |
          python -m venv docs/site/.venv
          docs/site/.venv/bin/pip install -r docs/site/requirements-dev.txt

      - name: Install swagger-ui-dist into the silo (docs/site/), locked
        run: npm --prefix docs/site ci

      - name: Regenerate needs pages from Doorstop and build the docs site
        run: just site-build

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/site/_build/html

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write # publish the built site to GitHub Pages
      id-token: write # mint the per-run OIDC credential the Pages deployment verifies
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
