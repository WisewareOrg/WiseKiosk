name: checks

# Repo-wide invariant gates that need no application code. They encode what must
# always be true of the repo and hold through any rewrite. CI holds no custom
# credential — the only token is the GitHub-provided read-only GITHUB_TOKEN.
on:
  push:
    branches: [main]
  pull_request:
    # edited: the process gate validates the PR title, so title fixes must re-run it
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

# A superseded pull-request head cancels its own run. A push run gets a group of its own, keyed on
# the sha: in a shared group a newly queued run replaces the pending one even with cancel-in-progress
# false, and a replaced push run is a push whose commits the secret scan never walks. `queue: max`
# would keep a shared group safe, but the pinned actionlint's schema rejects the key.
concurrency:
  group: checks-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Every job's `name:` equals its id: required status checks key on the displayed name. A matrix
  # job is the one exception the platform imposes — its displayed name carries its matrix values,
  # `image-arch (linux/amd64)` and `image-arch (linux/arm64)` — so the required set names each leg
  # rather than the job.
  # Every check with a local form runs as its `just` recipe — the recipe body is the one
  # spelling of what runs here and locally (docs/CI.md § Gate wiring) — and every setup-just
  # step pins `just-version:`, so the executor CI depends on is a decided version, not a float.
  docs-and-hygiene:
    name: docs-and-hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.58.0"

      - name: Install pre-commit into a local venv (siloed under scripts/)
        run: |
          python3 -m venv scripts/.venv
          scripts/.venv/bin/pip install -r scripts/requirements-dev.txt

      - name: No untracked, non-ignored file is present
        run: just check-untracked

      # lychee runs offline from the digest-pinned official image over the tracked Markdown set
      # (ADR 0016 rev 11); docker is not assumed on a contributor machine, so the step is a named
      # CI-only exception (docs/CI.md § Gate wiring) rather than a `just verify` check.
      # The file list is materialised and tested non-empty before lychee runs: a failed or empty
      # listing has judged nothing and must not read as a clean scan.
      - name: Every relative Markdown link resolves (lychee, offline)
        run: |
          git ls-files '*.md' > "$RUNNER_TEMP/tracked-md"
          test -s "$RUNNER_TEMP/tracked-md"
          docker run --rm -i -v "$PWD:/repo:ro" -w /repo lycheeverse/lychee:0.24.2@sha256:e2d19e57cf6ab037026f20b8e449a1f30d9d7f81eef4194763aab2eab20bd28d --offline --no-progress --files-from - < "$RUNNER_TEMP/tracked-md"

      - name: Every pre-commit-stage hook passes over every tracked file
        run: just check-hooks

      - name: The decisions directory and its index table agree
        run: just check-adr-index

      - name: Every ADR citation pins that ADR's current rev
        run: just check-adr-revs

      - name: Every tracked document outside a dot-directory is claimed by the documentation index
        run: just check-docs-index

      - name: No manifest at the repository root, no recipe is a shell script, and renovate.json extends the pinned tjwise99/wise-renovate preset
        run: just check-repo-silo

      - name: Workflow supply-chain and privilege audit (zizmor, pedantic persona, offline audit set)
        uses: docker://ghcr.io/zizmorcore/zizmor@sha256:863026d54f91271b10b60b67ad8054cb37120167e162482597db102b3026a284 # 1.29.0
        with:
          args: --persona=pedantic .github/workflows

      - name: Workflow schema and expression lint (actionlint)
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # 1.7.12

      - name: Every tracked file is a declared authored or derived kind
        run: just check-languages

      - name: Every service in the committed deployment recipe declares a restart policy
        run: just check-restart-policy

      - name: The verify job in publish.yml holds no write scope
        run: just check-publish-permissions

  requirements:
    name: requirements
    # Validates the Doorstop requirements tree: every TST reference resolves, no
    # suspect/unreviewed/orphan items, no item claims a verification method its
    # children do not support, and no item's statement cites another item by
    # identifier. Runs `just check-reqs` and `just check-citations`, the recipes
    # the local gate runs, which read the tree through the same venv; which
    # commands those are is the recipes' own bodies.
    # The tool is siloed under docs/requirements/ with the feature it serves.
    # No secrets: pure tree validation.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.58.0"

      - name: Install Doorstop into a local venv (siloed under docs/requirements/)
        run: |
          python -m venv docs/requirements/.venv
          docs/requirements/.venv/bin/pip install -r docs/requirements/requirements-dev.txt

      - name: Every requirements-tree check passes, and the proposed-item backlog prints (reports; not a gate)
        run: just check-reqs

      - name: Every citation resolves and carries its item header
        run: just check-citations

  docs-site:
    name: docs-site
    # Builds the docs site with -W: a broken cross-reference or orphaned page
    # fails the gate. Deploy is a separate workflow (pages.yml) so this job
    # stays read-only.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.58.0"

      - name: Install the docs-site toolchain into a local venv (siloed under docs/site/)
        run: |
          python -m venv docs/site/.venv
          docs/site/.venv/bin/pip install -r docs/site/requirements-dev.txt

      - name: Install swagger-ui-dist into the silo (docs/site/), locked
        run: npm --prefix docs/site ci

      - name: Regenerate needs pages from Doorstop and build the docs site (warnings-as-errors)
        run: just check-site

  architecture:
    name: architecture
    # Validates the LikeC4 architecture model and regenerates every generated
    # output — the artifacts under docs/architecture/ and the diagrams spliced
    # into docs/ARCHITECTURE.md — then fails on any drift (`git diff
    # --exit-code`): the staleness gate that mirrors the repo's "CI fails on
    # stale generated code" rule for the architecture layer. Then the model and
    # the Doorstop tree are resolved against each other in both directions.
    # Doorstop is read through the requirements silo's venv and LikeC4 through
    # the architecture silo's node_modules, each with the feature it serves.
    # Browser-free:
    # bundled WASM graphviz, no chromium. No secrets: pure model validation +
    # codegen.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.58.0"

      - name: Install LikeC4 into the silo (docs/architecture/), locked
        run: npm --prefix docs/architecture ci

      - name: Install Doorstop into a local venv (siloed under docs/requirements/)
        run: |
          python -m venv docs/requirements/.venv
          docs/requirements/.venv/bin/pip install -r docs/requirements/requirements-dev.txt

      - name: Architecture model validates and generated artifacts are neither stale, orphaned, nor uncommitted
        run: just check-arch

      - name: Every tagged identifier resolves to an accepted item, and every accepted, active item is tagged
        run: just check-arch-trace

  frontend:
    name: frontend
    # Builds the static single-page bundle, then holds it to what ADR 0018 rev 1 decided: one HTML
    # entry with an empty mount, no server half, no SSR target or adapter declared, and every npm
    # package in the emitted module graph in the committed allowlist. Then eslint, svelte-check and
    # the whole-project TS 7 typecheck run (docs/CI.md § Lint and type checks), then `npm audit` over
    # the whole dependency tree (docs/CI.md § Dependency vulnerabilities) — the one step here needing
    # the network. Every generator and runner is pinned in the silo it belongs to, through
    # frontend/package-lock.json. No secrets: build, static assertion and an unauthenticated registry
    # query.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.58.0"

      - name: Install the frontend toolchain into the silo (frontend/), locked
        run: npm --prefix frontend ci

      - name: The frontend build emits a static single-page bundle
        run: just check-static-bundle

      - name: The frontend is clean under eslint and svelte-check
        run: just check-lint-frontend

      - name: The whole frontend typecheck (tsc --noEmit, TS 7) is clean
        run: just check-typecheck-frontend

      - name: No npm dependency carries a known vulnerability, unless the exception register covers it
        run: just check-vulns-npm

  frontend-tests:
    name: frontend-tests
    # The frontend's two test tiers (ADR 0027 rev 1): Vitest over the unit tier, and Playwright over
    # the render tier at each of the three supported viewports. The render tier needs a browser that
    # computes layout and paint, which is what `just render-install` provisions — the one step here
    # that is a setup recipe rather than a gate. No secrets: the render tier drives a local dev
    # server and reaches no network origin. The dead-test detector runs here rather than in a job of
    # its own: it asks each runner what it would discover, and this is the job that already carries
    # both frontend runners installed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26

      # The dead-test detector asks `go list` what the backend's test files are, so this job needs
      # the Go toolchain beside the frontend one; the tests it runs are backend-tests' own.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.58.0"

      - name: Install the frontend toolchain into the silo (frontend/), locked
        run: npm --prefix frontend ci

      - name: Install the browser the render tier drives
        run: just render-install

      - name: The frontend unit tier passes
        run: just check-unit

      - name: The frontend render tier passes at each supported viewport
        run: just check-render

      - name: The render tier renders clean under the served security response headers
        run: just check-render-policy

      - name: Every committed test file falls under a configured runner's reach
        run: just check-dead-test

  backend-tests:
    name: backend-tests
    # Runs `just check-go` (docs/CI.md § Backend build, vet and tests), `just check-fuzz`
    # (docs/CI.md § Backend fuzz), `just check-lint-go` (docs/CI.md § Lint and type checks),
    # `just check-secret-unwrap` (docs/CI.md § Module and framework structure) and
    # `just check-vulns-go` (docs/CI.md § Dependency vulnerabilities, the one step here needing the
    # network). A job of its own, bundling five related backend checks: one job answers with one
    # check-run, giving the required-status-check ruleset a single name to require rather than five.
    # The `cmd` package's bounded-footprint soak runs inside
    # `go test ./...` and is ~2min of this job, and is the one package the recipe's race-detector
    # pass leaves out. No secrets: the tests serve over loopback (`net/http/httptest`) and reach no
    # network origin but govulncheck's own query to vuln.go.dev, which is unauthenticated.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.58.0"

      - name: Install the Go module's dependencies into the silo (backend/), locked
        run: go -C backend mod download

      - name: The backend Go tree builds, passes vet, its tests pass, and internal/ is race-free
        run: just check-go

      - name: FuzzShape, FuzzDecodeRequest and FuzzValidate each run fuzzed for 10s
        run: just check-fuzz

      - name: The backend Go tree is clean under golangci-lint's default linter set
        run: just check-lint-go

      - name: Exactly one non-test reference unwraps the confined secret type
        run: just check-secret-unwrap

      - name: No resolved Go module dependency carries a known vulnerability reachable from the build, unless the exception register covers it
        run: just check-vulns-go

  coverage:
    name: coverage
    # The unit-test coverage bar (ADR 0005 rev 4, gate 3): go-test-coverage over the backend, and
    # one merged Istanbul gate over every frontend `.ts` and `.svelte` file — the unit tier
    # (`@vitest/coverage-istanbul`) and the render tier (`vite-plugin-istanbul` +
    # `coverage-teardown.ts`) each write their own coverage-final.json, and
    # `scripts/merge-coverage.ts` unions the two and enforces the bar its own config sets — each
    # per-file and total. `gcov2lcov` then converts the backend's Go coverprofile to lcov (via the
    # `backend/go.mod` tool directive) and `grcov` merges it with the frontend's own lcov into one
    # diagnostic, never-gating HTML report over both languages, uploaded as an artifact. This job
    # runs the same recipe `just verify` depends on — though the required-checks ruleset naming
    # it a required status check, so a red run here would also block a merge at the platform
    # level, stays a separate, later action. The recipe body is the one spelling of what runs,
    # here and locally. No secrets: the tests serve over loopback and reach no network origin.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.58.0"

      - name: Install the Go module's dependencies into the silo (backend/), locked
        run: go -C backend mod download

      - name: Install the frontend toolchain into the silo (frontend/), locked
        run: npm --prefix frontend ci

      - name: Install the browser the render tier drives
        run: just render-install

      - name: Install grcov, pinned
        uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2.87.19
        with:
          tool: grcov

      - name: The unit-test coverage bar over the backend and the frontend, and the unified report
        run: just check-coverage

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage-report
          path: coverage/unified-report/

  image-tests:
    name: image-tests
    # The image tier (docs/TESTING.md): builds the container image and holds the artifact to what
    # the tree obliges of it — a non-root user, a configuration that comes from the mount and
    # nowhere else, no deployment content, two instances sharing nothing, and no secret-shaped value
    # in any layer. It carries the health-signal check alongside them (docs/CI.md § Deployment and
    # bring-up), which is a gate over the same artifact and needs the same Docker.
    # A job of its own rather than a step elsewhere because it is the one tier that
    # needs Docker, which is why it is not a `just verify` dependency (docs/CI.md § Gate wiring:
    # Docker is not assumed on a contributor machine). The recipe body is the one spelling of what
    # runs, here and locally. No secrets: the image is built and run locally on the runner and is
    # pushed nowhere — publishing is publish.yml's.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.58.0"

      - name: The image runs non-root, serves only a mounted configuration, carries no deployment content or secret material, keeps two instances independent, and reports its health in both directions
        run: just check-image

      - name: No package in the built image carries a known vulnerability at any severity, unless the exception register covers it
        run: python3 scripts/vulns/check_vulns.py --scope image --image wisekiosk:citest

  image-arch:
    name: image-arch
    # Both architectures a published image carries, one leg each: the image is built for the
    # leg's platform and smoke-tested on it (scripts/image/smoke.py). One leg per platform rather
    # than one job building both, so a failure names the architecture it happened on, and
    # fail-fast is off so the other architecture still reports. The arm64 leg builds and runs under
    # QEMU emulation — this runner is amd64, as publish.yml's multi-arch build is. The recipe body
    # is the one spelling of what runs, here and locally. No secrets: the image is built and run on
    # the runner and pushed nowhere.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.58.0"

      - name: The image builds for this leg's platform and comes up serving on it
        env:
          PLATFORM: ${{ matrix.platform }}
        run: just smoke-image "$PLATFORM"

  native-arch:
    name: native-arch
    # The architecture no published image carries, smoke-tested as the application rather than an
    # image: the bundle is built, the backend cross-compiled for armv6l, and the binary run on this
    # amd64 runner under the emulation setup-qemu-action registers (docs/CI.md § Native binary run).
    # No secrets: everything is built and run on the runner and pushed nowhere.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.58.0"

      - name: Install the frontend toolchain into the silo (frontend/), locked
        run: npm --prefix frontend ci

      - name: Install the Go module's dependencies into the silo (backend/), locked
        run: go -C backend mod download

      - name: The backend cross-compiles for armv6l and the application comes up serving natively on it
        run: just smoke-native

  process:
    name: process
    # Process gates (ADR 0006 rev 5): the branch is named type_number-snake_name and
    # links an open issue labeled with its type; the PR title — the commit that
    # reaches main under squash-merge — is a Conventional Commit. The branch check
    # is `just check-branch`, handed the PR's head ref, reading its pattern from
    # scripts/branch-shape.regex; the title runs through the hook layer's pinned
    # commitlint (ADR 0016 rev 11) against the pull-request-title configuration,
    # which drops the fixup!/squash!/merge allowances that never reach main.
    # The branch check also gates the recorded PR↔ticket
    # linkage: the PR's Development field (closingIssuesReferences) must link
    # the branch's issue on every base, so the ticket closes when the PR merges
    # into the default branch.
    # head_ref and the PR title are attacker-controlled, so they
    # enter run steps only via env mapping, never inline. GITHUB_TOKEN is the
    # GitHub-provided read-only token (API rate limits, GraphQL read), not a
    # custom credential.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.58.0"

      - name: Branch named type_number-snake_name, its issue open, type-labeled, milestoned and parented to match the PR base
        env:
          HEAD_REF: ${{ github.head_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: just check-branch "$HEAD_REF"

      - name: Install pre-commit into a local venv (siloed under scripts/)
        run: |
          python3 -m venv scripts/.venv
          scripts/.venv/bin/pip install -r scripts/requirements-dev.txt

      - name: PR title is a Conventional Commit (the squash-merge commit on main)
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n' "$PR_TITLE" > "$RUNNER_TEMP/pr-title"
          COMMITLINT_TITLE_FILE="$RUNNER_TEMP/pr-title" scripts/.venv/bin/pre-commit run commitlint-pr-title --hook-stage manual

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the scan walks a commit range, which a shallow clone does not carry
      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
